<div class="backdrop"></div>
<dialog open>
<h2>Add Task</h2>
<form #taskForm="ngForm" (ngSubmit)="onSubmit(taskForm)" >
<p>
<label for="title">Title</label>
<input type="text" id="title" [(ngModel)]="titleInput" name="Title" required maxlength="18" #titleControl="ngModel"
/>
</p>
@if(titleControl.invalid && titleControl.touched){
<p class="error-messages">נא להכניס שם</p>
}
<p>
<label for="summary">Summary</label>
<textarea id="summary" rows="5" [(ngModel)]="summaryInput" name="summary" required maxlength="50" #summaryControl="ngModel"
></textarea>
</p>
@if(summaryControl.invalid && summaryControl.touched){
<p class="error-messages">נא להכניס תוכן</p>
}
<p>
<label for="due-date">Due Date</label>
<input type="date" id="due-date" [(ngModel)]="dateInput" name="date" required #dateControl="ngModel"
/>
</p>
@if(dateControl.invalid && dateControl.touched){
<p class="error-message">נא להכניס תאריך</p>
}

<p class="actions">
<button type="button">Cancel</button>
<button type="submit" [disabled]="taskForm.form.invalid">Create</button>
</p>
</form>
</dialog>
